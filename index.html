<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jaden's Student Management</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #16161e;
            --panel: #1f2335;
            --raised: #292e42;
            --line: #33385a;
            --text: #c0caf5;
            --muted: #6b7399;
            --blue: #7aa2f7;
            --purple: #bb9af7;
            --orange: #ff9e64;
            --teal: #7dcfff;
            --ok: #9ece6a;
            --err: #f7768e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 48px 16px;
            min-height: 100vh;
            color: var(--text);
            font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
            font-size: 15px;
            background:
                radial-gradient(ellipse 70% 40% at 20% 0%, rgba(122, 162, 247, 0.12), transparent 70%),
                var(--bg);
        }

        main {
            width: min(760px, 100%);
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 4px;
            font-size: clamp(26px, 6vw, 38px);
            font-weight: 700;
            color: var(--blue);
        }

        /* the one moving thing on the page */
        h1::after {
            content: "";
            display: inline-block;
            width: 0.5em;
            height: 0.95em;
            margin-left: 6px;
            vertical-align: -0.1em;
            background: var(--purple);
            animation: blink 1.1s steps(1) infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        @media (prefers-reduced-motion: reduce) {
            h1::after { animation: none; }
        }

        .comment {
            margin: 0 0 32px;
            color: var(--muted);
        }

        /* editor window */
        .panel {
            margin-bottom: 24px;
            overflow: hidden;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        .tab {
            display: inline-block;
            margin: 0;
            padding: 10px 18px;
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            background: var(--panel);
            border-bottom: 2px solid var(--blue);
        }

        .tabbar {
            background: var(--bg);
            border-bottom: 1px solid var(--line);
        }

        .body { padding: 22px; }

        .form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--purple);
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            color: var(--text);
            font: inherit;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 6px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input::placeholder { color: #444b73; }

        input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(122, 162, 247, 0.22);
        }

        button {
            padding: 10px 20px;
            color: #12141f;
            font: 700 14px "JetBrains Mono", monospace;
            background: var(--blue);
            border: 1px solid var(--blue);
            border-radius: 6px;
            cursor: pointer;
            transition: filter 0.15s, transform 0.1s;
        }

        button:hover { filter: brightness(1.12); }
        button:active { transform: translateY(1px); }
        button:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

        .ghost {
            color: var(--text);
            background: transparent;
            border-color: var(--line);
        }

        .ghost:hover { border-color: var(--blue); filter: none; }

        .form button { grid-column: 1 / -1; justify-self: start; margin-top: 4px; }

        .head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 14px;
        }

        .query { color: var(--muted); }
        .kw { color: var(--purple); }
        .id { color: var(--orange); }

        .scroll { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 8px 12px;
            text-align: left;
            color: var(--purple);
            font-weight: 500;
            border-bottom: 1px solid var(--line);
        }

        td {
            padding: 9px 12px;
            border-bottom: 1px solid rgba(51, 56, 90, 0.5);
        }

        tbody tr:hover td { background: var(--raised); }

        /* line-number gutter */
        th:first-child,
        td:first-child {
            width: 52px;
            color: var(--muted);
            text-align: right;
            border-right: 1px solid var(--line);
        }

        td.course { color: var(--orange); }
        td.year { color: var(--teal); }

        td.empty {
            padding: 28px 12px;
            text-align: center;
            color: var(--muted);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 22px;
            color: var(--muted);
            font-size: 13px;
            background: var(--bg);
            border-top: 1px solid var(--line);
        }

        .status::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
        }

        .status.ok::before { background: var(--ok); }
        .status.err::before { background: var(--err); }
        .status.err { color: var(--err); }

        @media (max-width: 560px) {
            .form { grid-template-columns: 1fr; }
            .body { padding: 18px 14px; }
            .status { padding: 8px 14px; }
        }
    </style>
</head>

<body>
    <main>
        <h1>student_management</h1>
        <p class="comment">// API + MySQL CRUD demo</p>

        <!-- INSERT -->
        <section class="panel">
            <div class="tabbar"><h2 class="tab">insert.sql</h2></div>

            <div class="body">
                <div class="form">
                    <div>
                        <label for="name">name</label>
                        <input type="text" id="name" placeholder="Juan Dela Cruz">
                    </div>
                    <div>
                        <label for="course">course</label>
                        <input type="text" id="course" placeholder="BSIT">
                    </div>
                    <div>
                        <label for="yearLevel">year_level</label>
                        <input type="number" id="yearLevel" placeholder="1" min="1">
                    </div>

                    <button onclick="addStudent()">Add student</button>
                </div>
            </div>
        </section>

        <!-- RETRIEVE -->
        <section class="panel">
            <div class="tabbar"><h2 class="tab">students.sql</h2></div>

            <div class="body">
                <div class="head">
                    <span class="query"><span class="kw">SELECT</span> * <span class="kw">FROM</span> students;</span>
                    <button class="ghost" onclick="loadStudents()">Refresh</button>
                </div>

                <div class="scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>name</th>
                                <th>course</th>
                                <th>year_level</th>
                            </tr>
                        </thead>
                        <tbody id="studentTable"></tbody>
                    </table>
                </div>
            </div>

            <div class="status" id="status">connecting...</div>
        </section>
    </main>

    <script>

        function setStatus(ok, text) {
            const el = document.getElementById("status");
            el.className = "status " + (ok ? "ok" : "err");
            el.textContent = text;
        }

        // RETRIEVE
        async function loadStudents() {
            const table = document.getElementById("studentTable");

            try {
                const res = await fetch("/api/students");
                if (!res.ok) throw new Error();
                const students = await res.json();

                table.innerHTML = "";

                if (!students.length) {
                    table.innerHTML = `<tr><td class="empty" colspan="4">No students yet. Add one above.</td></tr>`;
                } else {
                    students.forEach((s, i) => {
                        table.innerHTML += `
                            <tr>
                                <td>${i + 1}</td>
                                <td>${s.name}</td>
                                <td class="course">${s.course}</td>
                                <td class="year">${s.year_level}</td>
                            </tr>
                        `;
                    });
                }

                setStatus(true, `connected: ${students.length} rows`);
            } catch {
                setStatus(false, "request failed: check that node server.js and MySQL are running");
            }
        }

        // INSERT
        async function addStudent() {
            const name = document.getElementById("name").value;
            const course = document.getElementById("course").value;
            const yearLevel = document.getElementById("yearLevel").value;

            await fetch("/api/students", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, course, year_level: yearLevel })
            });

            document.getElementById("name").value = "";
            document.getElementById("course").value = "";
            document.getElementById("yearLevel").value = "";

            loadStudents();
        }

        // Load students when the page opens
        loadStudents();

    </script>
</body>

</html>
